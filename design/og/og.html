<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#17181a;font-family:Manrope,sans-serif}
.bg{position:absolute;right:0;top:0;width:820px;height:630px;object-fit:cover;object-position:55% center}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#17181a 0%,#17181a 36%,rgba(23,24,26,.82) 55%,rgba(23,24,26,.15) 100%)}
.c{position:absolute;left:72px;top:64px;bottom:64px;width:640px;display:flex;flex-direction:column}
.logo{height:64px;width:auto;align-self:flex-start}
.eb{margin-top:auto;display:flex;align-items:center;gap:14px;color:#f05b2c;font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.eb:before{content:"";width:40px;height:3px;background:#f05b2c;border-radius:2px}
h1{margin-top:20px;color:#fff;font-size:62px;line-height:1.06;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;color:#f05b2c}
.f{margin-top:34px;display:flex;gap:28px;color:rgba(255,255,255,.85);font-weight:700;font-size:24px}
.f span{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#f05b2c}
.bar{position:absolute;left:0;bottom:0;width:100%;height:8px;background:#f05b2c}
</style></head><body>
<img class="bg" src="../../public/img/truck-highway.webp"><div class="shade"></div>
<div class="c">
<img class="logo" src="../../public/img/logo-light.png">
<div class="eb">Transport · Spedycja · Magazynowanie</div>
<h1>Ładunki dostarczone <em>na&nbsp;czas</em>, w&nbsp;kraju i&nbsp;w&nbsp;Europie</h1>
<div class="f"><span><i class="dot"></i>+48 42 278 75 74</span><span><i class="dot"></i>office@g-tsl.com</span></div>
</div><div class="bar"></div>
</body></html>
